# Bottom Divergence Double Breakout Strategy / 底背离双突破 (Strategy E)
# DIF/DEA bottom reversal divergence + fresh double breakout confirmation.

name: bottom_divergence_double_breakout
display_name: 底背离双突破
description: 基于DIF/DEA底部反转类底背离 + 下降趋势线/水平阻力线双突破确认的联合买入策略。
category: reversal
core_rules: [1, 3]
required_tools:
  - get_daily_history
  - get_realtime_quote

# -- 五层系统 metadata --
system_role: entry_core
strategy_family: reversal
applicable_market: [balanced, aggressive]
applicable_theme: [main_theme, secondary_theme, follower_theme, non_theme]
setup_type: bottom_divergence_breakout

screening:
  filters:
    - field: bottom_divergence_double_breakout
      op: "=="
      value: true
    - field: bottom_divergence_actionable_entry
      op: "=="
      value: true
    - field: bottom_divergence_confirmation_days
      op: "<="
      value: 3
  scoring:
    - field: bottom_divergence_signal_strength
      weight: 35
      cap: 1.0
    - field: bottom_divergence_entry_timing_score
      weight: 25
      cap: 1.0
    - field: volume_ratio
      weight: 20
      cap: 5.0
    - field: trend_score
      weight: 20

instructions: |
  **底背离双突破（Strategy E — 联合检测器版）**

  本策略使用 BottomDivergenceBreakoutDetector 检测基于 DIF/DEA 的底背离形态，
  并通过双突破（下降趋势线 + 水平阻力线）进行联合确认。

  信号判定标准（state == "confirmed"）：

  1. **底背离检测**：
     - 在价格 swing lows 中找到 A/B 低点对（10~60 bars，中间有反弹高点 H）。
     - 匹配 DIF/DEA 在 A/B 附近的局部最低值。
     - 对价格和 MACD 各自进行三态分类（down/flat/up），仅保留真正底部反转型：
       - price_down_macd_up、price_down_macd_flat、price_flat_macd_up
     - price_flat_macd_down 与 price_up_* 强势回撤形态不再进入本策略主筛选。

  2. **上下文门控**：
     - 底部反转型（price_down/flat）：前置下跌验证（MA5<MA20 或价格斜率为负）。

  3. **双突破确认与入场时效**：
     - 水平阻力线：反弹高点 H 的价格。
     - 下降趋势线：基于结构 swing highs 拟合。
     - 收盘价同时突破两者。
     - `bottom_divergence_actionable_entry == true` 要求信号刚完成双突破，或 3 根 K 内仍在确认价上方且偏离不超过 10%。

  4. **同步性判断**：
     - 两种突破在 3 bars 窗口内发生 → confirmed（sync_breakout=True）。
     - 间隔超过 3 bars → late_or_weak。

  评分调整：
  - signal_strength（综合评分：touch_count、volume_ratio、突破幅度、背离强度）权重最高。
  - entry_timing_score 用于奖励刚完成双突破或仍贴近突破确认价的最佳入场区。
  - 量比作为流动性确认。
  - 趋势评分和流动性作为辅助确认。

ai_gate:
  version: v1
  ai_priority: 1
  supported: true

  playbook:
    goal: 确认底背离双突破结构的有效性，判断当前是否处于可操作的入场窗口
    focus:
      - 验证背离结构（A/B低点、MACD背离形态）是否完整
      - 确认双突破（水平阻力 + 下降趋势线）的同步性和力度
      - 评估量价配合关系
      - 结合新闻/公告判断是否存在基本面否决因子
    output_contract:
      verdict: "buy | watch | reject"
      confidence: "0.0-1.0"
      stage: "当前所处阶段标签"
      primary_action: "下一步操作建议（一句话）"
      watch_levels:
        entry_price: "建议入场价"
        stop_loss: "止损价"
        target_price: "目标价"
      reasoning: "结构化判断依据（2-3句）"

  stage_definitions:
    structure_forming:
      label: 结构形成中
      description: A/B低点和MACD背离已识别，但双突破尚未确认
      typical_verdict: watch
    confirm_entry_window:
      label: 确认入场窗口
      description: 双突破已确认（sync_breakout=True），处于3根K线入场窗口内
      typical_verdict: buy
    late_or_weak:
      label: 迟到或弱势
      description: 突破不同步或已超过入场窗口
      typical_verdict: watch
    breakout_failed:
      label: 突破失败
      description: 价格回落至阻力线下方，结构失效
      typical_verdict: reject

  hard_veto_rules:
    - "ST / *ST股票直接reject"
    - "上市不足60天直接reject"
    - "重大利空公告（财务造假、退市风险警示）直接reject"
    - "连续跌停未开板直接reject"

  news_focus:
    - 行业政策变化
    - 公司重大公告
    - 机构调研/持仓变动
    - 板块资金流向

  payload_fields:
    - signal_strength
    - divergence_pattern
    - sync_breakout
    - breakout_freshness_bars
    - price_low_a
    - price_low_b
    - rebound_high
    - horizontal_resistance
